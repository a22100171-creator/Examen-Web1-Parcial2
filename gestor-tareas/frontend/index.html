<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestor sencillo de actividades.">
  <title>Examen</title>
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Examen</h1>
      <p>Gestor de actividades</p>
    </header>

    <!-- El mismo formulario permite registrar y actualizar una actividad. -->
    <section class="card" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Nueva actividad</h2>
      <form id="formulario">
        <label for="nombre">Nombre</label>
        <input id="nombre" required maxlength="100" placeholder="Nombre de la actividad">

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="3" required maxlength="1000" placeholder="Describe lo que se debe hacer"></textarea>

        <div class="form-bottom">
          <div class="status-field">
            <label for="estado">Estado</label>
            <select id="estado">
              <option>Pendiente</option>
              <option>En proceso</option>
              <option>Completada</option>
            </select>
          </div>
          <div class="actions">
            <button type="button" class="secondary" id="cancelar" hidden>Cancelar</button>
            <button type="submit" id="guardar">Guardar actividad</button>
          </div>
        </div>
        <p id="error-formulario" class="error" role="alert"></p>
      </form>
    </section>

    <!-- Búsqueda y filtro para consultar las actividades registradas. -->
    <section class="card" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Actividades</h2>
      <div class="filters">
        <input id="buscar" type="search" placeholder="Buscar actividad…" aria-label="Buscar actividad">
        <select id="filtro" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option>Pendiente</option>
          <option>En proceso</option>
          <option>Completada</option>
        </select>
      </div>
      <div class="table-wrap" id="tabla">
        <table>
          <thead><tr><th scope="col">Actividad</th><th scope="col">Estado</th><th scope="col">Acción</th></tr></thead>
          <tbody id="actividades"></tbody>
        </table>
      </div>
      <div class="empty" id="vacio" hidden>
        <p id="texto-vacio">Todavía no hay actividades.</p>
        <small>Usa el formulario para registrar la primera.</small>
      </div>
      <p id="resultado" class="count">Cargando actividades…</p>
    </section>
    <p id="mensaje" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
